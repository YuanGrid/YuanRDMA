</defs><rect width="1580" height="1253" fill="#FFFFFF"/><text x="790.0" y="52" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#B48B2E" letter-spacing="2.6">YUANGUID  ·  DATA PATH</text><text x="790.0" y="92" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="33" font-weight="700" fill="#1B2233">YuanNIC 板内数据通路</text><text x="790.0" y="121" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#8A93A6">Host → PCIe → DMA → Doorbell / 表项 → RoCEv2 传输引擎 → 流量管理 → F-tile MAC</text><line x1="45" y1="142" x2="1535" y2="142" stroke="#C9CFDC"/><rect x="100" y="170" width="1200" height="176" rx="11" fill="#FBF7FD" stroke="#612B9B" stroke-width="1.2" stroke-dasharray="7 5"/><text x="124" y="201" font-family="Noto Sans CJK SC" font-size="15.5" font-weight="700" fill="#612B9B" letter-spacing="2">HOST   主机侧</text><text x="124" y="234" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">应用</text><text x="212" y="234" font-family="Noto Sans Mono CJK SC" font-size="16" fill="#5B6478">NCCL / perftest / 存储客户端（不改代码）</text><text x="124" y="268" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">用户态</text><text x="212" y="268" font-family="Noto Sans Mono CJK SC" font-size="16" fill="#5B6478">libibverbs → rdma-core v66 provider libyuanrdma（PABI 65）</text><text x="124" y="302" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">内核</text><text x="212" y="302" font-family="Noto Sans Mono CJK SC" font-size="16" fill="#5B6478">ib_core ← yuanrdma.ko（QP 状态机 / MR / CM / GSI）· 以太网 yuannic.ko</text><path d="M430 346 v32" stroke="#612B9B" stroke-width="2.4" marker-end="url(#ah)"/><rect x="100" y="390" width="1200" height="58" rx="29" fill="url(#bar)" filter="url(#sh)"/><text x="138" y="426.0" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF">PCIe Gen5 x16 <tspan font-family="Noto Sans Mono CJK SC" font-size="15.5" font-weight="400" fill="#C9BCE6">(R-tile)</tspan></text><text x="700.0" y="426.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="16" fill="#EFE7FF">BAR0 寄存器</text><text x="1262" y="426.0" text-anchor="end" font-family="Noto Sans Mono CJK SC" font-size="14.5" fill="#C9BCE6">BAR2 UAR / doorbell</text><path d="M430 448 v30" stroke="#612B9B" stroke-width="2.4" marker-end="url(#ah)"/><rect x="100" y="496" width="1200" height="697" rx="13" fill="#FCFBF8" stroke="#B48B2E" stroke-width="1.3" stroke-dasharray="8 5"/><text x="126" y="526" font-family="Noto Sans CJK SC" font-size="15.5" font-weight="700" fill="#B48B2E">YuanNIC·NH400-C</text><text x="312" y="526" font-family="Noto Sans Mono CJK SC" font-size="14.5" fill="#B48B2E">FPGA Agilex 7 I  ·  AGIB041</text><rect x="124" y="548" width="1148" height="117" rx="9" fill="#EEF1FB" stroke="#DCE2F5"/><rect x="124" y="548" width="152" height="117" rx="9" fill="#37449E" fill-opacity="0.09"/><line x1="276" y1="549" x2="276" y2="664" stroke="#37449E" stroke-width="1.2" stroke-opacity="0.30"/><text x="200" y="612.5" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="16.5" font-weight="700" fill="#37449E">DMA 层</text><text x="298" y="574" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">AXI MCDMA</text><text x="401.2" y="574" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">BAM: CSR / doorbell</text><text x="401.2" y="607" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">BAS: 引擎主动 DMA（WQE / CQE）</text><text x="401.2" y="640" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">MCDMA: netdev 收发</text><text x="1254" y="596.5" text-anchor="end" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">WQE 取指由引擎发起</text><text x="1254" y="617.5" text-anchor="end" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">零 CPU 拷贝</text><rect x="124" y="675" width="1148" height="117" rx="9" fill="#F5F0FC" stroke="#E7DBF7"/><rect x="124" y="675" width="152" height="117" rx="9" fill="#6B3FA0" fill-opacity="0.09"/><line x1="276" y1="676" x2="276" y2="791" stroke="#6B3FA0" stroke-width="1.2" stroke-opacity="0.30"/><text x="200" y="739.5" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="16.5" font-weight="700" fill="#6B3FA0">主机接口</text><text x="298" y="701" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">Doorbell</text><text x="465.2" y="701" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">QPC / CQC 表</text><text x="298" y="734" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">MR / MTT 翻译缓存</text><text x="465.2" y="734" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">CQ / EQ</text><text x="298" y="767" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">MSI-X</text><text x="465.2" y="767" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">中断与事件队列</text><text x="1254" y="723.5" text-anchor="end" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">doorbell 写 BAR2</text><text x="1254" y="744.5" text-anchor="end" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">WC 映射旁路</text><rect x="124" y="802" width="1148" height="150" rx="9" fill="#EAF7F2" stroke="#CDE9DE"/><rect x="124" y="802" width="152" height="150" rx="9" fill="#1E7A5A" fill-opacity="0.09"/><line x1="276" y1="803" x2="276" y2="951" stroke="#1E7A5A" stroke-width="1.2" stroke-opacity="0.30"/><text x="200" y="872.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#1E7A5A">RoCEv2</text><text x="200" y="898.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#1E7A5A">传输引擎</text><text x="298" y="828" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">TX 通道</text><text x="380.4" y="828" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">SQ 调度 + WQE 取指 → 分段 / 组包 → BTH / RETH / AETH / DETH / ImmDt → ICRC 生成</text><text x="298" y="861" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">RX 通道</text><text x="380.4" y="861" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">解析 / 校验 → PSN 排序 / 丢包检测 → ACK / NAK 与重传定时器 → 落内存 + CQE</text><text x="298" y="894" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">限速</text><text x="380.4" y="894" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">DCQCN RP 限速（per-QP 令牌桶，128 QP）· ECN → CNP 生成（NP）</text><text x="298" y="927" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">时钟</text><text x="380.4" y="927" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">core_clk 250 MHz · 4 lane 组包流水 · 64 CQ / 128 QP（可扩 4096）</text><text x="1254" y="867.0" text-anchor="end" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">组包与解析</text><text x="1254" y="888.0" text-anchor="end" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">全部由硬件完成</text><rect x="124" y="962" width="1148" height="117" rx="9" fill="#FDF4E7" stroke="#F2E0C4"/><rect x="124" y="962" width="152" height="117" rx="9" fill="#9A7222" fill-opacity="0.09"/><line x1="276" y1="963" x2="276" y2="1078" stroke="#9A7222" stroke-width="1.2" stroke-opacity="0.30"/><text x="200" y="1026.5" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="16.5" font-weight="700" fill="#9A7222">流量管理</text><text x="298" y="988" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">优先级队列</text><text x="402" y="988" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">SP / WRR</text><text x="298" y="1021" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">PFC 门控</text><text x="402" y="1021" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">802.1Qbb，按优先级</text><text x="298" y="1054" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">RX 分类</text><text x="402" y="1054" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">RoCE（UDP 4791）→ 引擎 · 其余 → netdev</text><text x="1254" y="1010.5" text-anchor="end" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">PFC 帧由硬核处理</text><text x="1254" y="1031.5" text-anchor="end" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">拥塞点在 TM 之前</text><rect x="124" y="1089" width="1148" height="84" rx="9" fill="#FBF2E3" stroke="#EEDCBC"/><rect x="124" y="1089" width="152" height="84" rx="9" fill="#8C6420" fill-opacity="0.09"/><line x1="276" y1="1090" x2="276" y2="1172" stroke="#8C6420" stroke-width="1.2" stroke-opacity="0.30"/><text x="200" y="1137.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="16.5" font-weight="700" fill="#8C6420">以太网硬核</text><text x="298" y="1115" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#1B2233">F-tile Hard IP</text><text x="445.2" y="1115" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">MAC + PCS + RS-FEC（544,514）</text><text x="445.2" y="1148" font-family="Noto Sans Mono CJK SC" font-size="15.5" fill="#5B6478">400G QSFP-112 · F-tile 400G-4</text><text x="1254" y="1121.0" text-anchor="end" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">MAC 收发硬核</text><text x="1254" y="1142.0" text-anchor="end" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">400G 单端口</text><text x="790.0" y="1217" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">数据面报文不经过主机软件栈；主机只负责提交 WQE 与收取 CQE。BAR2 偏移 = AVMM 地址 &lt;&lt; 1（PCIe5 语义）。</text></svg>