<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1093" viewBox="0 0 1760 1093"><defs>
<linearGradient id="gp" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#612B9B"/><stop offset="100%" stop-color="#3B5BDB"/></linearGradient>
<linearGradient id="netg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#F4F1FB"/><stop offset="100%" stop-color="#EAF1FB"/></linearGradient>
<filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
  <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1B2233" flood-opacity="0.09"/></filter>
<marker id="m0" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#612B9B"/></marker><marker id="m1" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3B5BDB"/></marker><marker id="m2" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1E7A5A"/></marker><marker id="m3" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C0392B"/></marker><marker id="m4" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B48B2E"/></marker></defs><rect width="1760" height="1093" fill="#FFFFFF"/><rect x="455.25" y="30" width="7" height="42" rx="3.5" fill="url(#gp)"/><text x="484.25" y="48" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#B48B2E" letter-spacing="2.5">YUANGUID  ·  CONTROL PATH</text><text x="484.25" y="86" font-family="Noto Sans CJK SC" font-size="31" font-weight="700" fill="#1B2233">YuanNIC 通信控制路径</text><text x="484.25" y="114" font-family="Noto Sans CJK SC" font-size="15" fill="#8A93A6">一次 RDMA 操作从应用提交到对端可用的完整路径　·　三条控制路径并存：常规 verbs　·　IBGDA　·　GPUDirect RDMA</text><line x1="45" y1="132" x2="1715" y2="132" stroke="#C9CFDC"/><rect x="78" y="168" width="544" height="198.5" rx="11" fill="#F2FAF7" stroke="#C4E2D4" filter="url(#sh)"/><rect x="78" y="169" width="5" height="196.5" rx="2.5" fill="#1E7A5A"/><text x="98" y="199" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#1E7A5A">Local GPU</text><text x="98" y="221" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">libibverbs 语义：GPU 侧准备 WQE 与数据</text><text x="98" y="244" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">① CPU 在主机内存构建 WQE（Write / Read / Send）</text><text x="98" y="271.5" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">② GPU 侧写门铃：IBGDA 由 GPU 直接发起</text><text x="98" y="299.0" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">③ 显存缓冲：GPUDirect RDMA 直连</text><text x="98" y="326.5" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">不经 CPU 中转主机内存 · 直连能力上板验证中</text><rect x="78" y="380.5" width="544" height="225.5" rx="11" fill="#FDFAF3" stroke="#EBDCBE" filter="url(#sh)"/><rect x="78" y="381.5" width="5" height="223.5" rx="2.5" fill="#B48B2E"/><text x="98" y="411.5" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B48B2E">Local CPU / Runtime</text><text x="98" y="433.5" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">控制面：建链、表项与完成处理</text><text x="98" y="456.5" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">执行流　ibv_post_send → 写 SQ → 敲 doorbell</text><text x="98" y="484.0" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">建链　　RoCE CM（QP1 / GSI）或 TCP 交换 QP 信息</text><text x="98" y="511.5" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">完成　　轮询 CQ 取 CQE，按 wr_id 归还缓冲</text><text x="98" y="539.0" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">QP 状态机与 MR 注册都在这一层</text><text x="98" y="565.0" font-family="Noto Sans Mono CJK SC" font-size="15" fill="#5B6478">libibverbs + rdma-core provider　·　libyuanrdma（PABI 65）</text><rect x="78" y="620.0" width="544" height="249.0" rx="11" fill="#FAF7FD" stroke="#DCCDEC" filter="url(#sh)"/><rect x="78" y="621.0" width="5" height="247.0" rx="2.5" fill="#612B9B"/><text x="98" y="651.0" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#612B9B">Local NIC</text><text x="98" y="673.0" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">YuanNIC·NH400-A</text><text x="98" y="696.0" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">④ doorbell + WQE 取指（MCDMA BAS 由引擎主动 DMA）</text><text x="98" y="723.5" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">⑤ lkey / rkey 校验 → MR / MTT 地址翻译</text><text x="98" y="751.0" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">⑥ RoCEv2 组包：BTH / RETH / AETH / DETH + ICRC</text><text x="98" y="778.5" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">⑦ PFC 门控 + DCQCN 限速（per-QP RP 令牌桶）</text><text x="98" y="806.0" font-family="Noto Sans Mono CJK SC" font-size="15" fill="#5B6478">core_clk 250 MHz · 4 lane 组包流水 · 64 CQ / 128 QP（可扩</text><text x="98" y="828.0" font-family="Noto Sans Mono CJK SC" font-size="15" fill="#5B6478">4096）· MTT 131072 · 单 MR ≤ 512 MiB</text><rect x="1090" y="168" width="544" height="171.0" rx="11" fill="#F2FAF7" stroke="#C4E2D4" filter="url(#sh)"/><rect x="1090" y="169" width="5" height="169.0" rx="2.5" fill="#1E7A5A"/><text x="1110" y="199" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#1E7A5A">Remote GPU</text><text x="1110" y="221" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">数据直达显存，或经主机内存中转</text><text x="1110" y="244" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">⑬ 数据直达显存（GPUDirect RDMA）</text><text x="1110" y="271.5" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">⑭ 完成事件：poll CQE / 门铃回调</text><text x="1110" y="299.0" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">⑮ 反向流量同样走 RoCEv2 RC　·　⑯ NCCL 多 QP 并行下发</text><rect x="1090" y="353.0" width="544" height="219.5" rx="11" fill="#FDFAF3" stroke="#EBDCBE" filter="url(#sh)"/><rect x="1090" y="354.0" width="5" height="217.5" rx="2.5" fill="#B48B2E"/><text x="1110" y="384.0" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B48B2E">Remote CPU / Runtime</text><text x="1110" y="406.0" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">上层应用无感知：同一 verbs 语义</text><text x="1110" y="429.0" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">⑫ 轮询 CQ / 收 Completion</text><text x="1110" y="456.5" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">Write / Write-Imm　落内存由硬件完成</text><text x="1110" y="484.0" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">Send　写入 RQ 缓冲后才产生 CQE</text><text x="1110" y="511.5" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">NCCL / perftest 不改代码直接跑　·　可见性由 CQ 顺序 + 内存屏障保证　·</text><text x="1110" y="532.5" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">　GID 索引与 MTU 需按本卡配置</text><rect x="1090" y="586.5" width="544" height="249.0" rx="11" fill="#FAF7FD" stroke="#DCCDEC" filter="url(#sh)"/><rect x="1090" y="587.5" width="5" height="247.0" rx="2.5" fill="#612B9B"/><text x="1110" y="617.5" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#612B9B">Remote NIC</text><text x="1110" y="639.5" font-family="Noto Sans CJK SC" font-size="14" fill="#8A93A6">同款 YuanNIC 或 NVIDIA ConnectX-7</text><text x="1110" y="662.5" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">⑧ RX 解析：PSN 排序 / 丢包与乱序检测</text><text x="1110" y="690.0" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">⑨ payload 落内存，CQE 写回主机</text><text x="1110" y="717.5" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">⑩ ACK / NAK 与重传定时器（Go-back-N）</text><text x="1110" y="745.0" font-family="Noto Sans CJK SC" font-size="15.5" fill="#1B2233">⑪ ECN 标记 → CNP 生成（DCQCN NP）</text><text x="1110" y="772.5" font-family="Noto Sans Mono CJK SC" font-size="15" fill="#5B6478">CQ 深度 ≤ 32768 · SQ/RQ 4096　|　interop：perftest 双向一对</text><text x="1110" y="794.5" font-family="Noto Sans Mono CJK SC" font-size="15" fill="#5B6478">一验证；UMR / 多 SGE 未实现</text><rect x="20" y="142" width="660" height="785.0" rx="16" fill="none" stroke="#B48B2E" stroke-width="1.4" stroke-dasharray="9 6"/><text x="44" y="164" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#B48B2E" letter-spacing="1.6">LOCAL ENDPOINT　本端主机</text><rect x="1032" y="142" width="660" height="785.0" rx="16" fill="none" stroke="#B48B2E" stroke-width="1.4" stroke-dasharray="9 6"/><text x="1056" y="164" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#B48B2E" letter-spacing="1.6">REMOTE ENDPOINT　对端主机</text><circle cx="856" cy="527.5" r="124" fill="url(#netg)" stroke="#612B9B" stroke-width="1.5"/><circle cx="856" cy="527.5" r="113" fill="none" stroke="#612B9B" stroke-width="0.9" stroke-opacity="0.22" stroke-dasharray="3 4"/><text x="856" y="481.5" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#1B2233" letter-spacing="2">NETWORK</text><text x="856" y="513.5" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="14.5" fill="#5B6478">RoCEv2 over Ethernet</text><text x="856" y="537.5" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="14.5" fill="#5B6478">400GbE · QSFP-112</text><text x="856" y="561.5" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="14.5" fill="#5B6478">PFC 无损 · ECN · DCQCN</text><text x="856" y="613.5" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="14" fill="#C0392B">ACK / NAK / CNP 回程</text><path d="M 78 332.5 L 49 332.5 L 49 654.0 L 78 654.0" fill="none" stroke="#3B5BDB" stroke-width="2.3" marker-end="url(#m1)"/><circle cx="49" cy="376.5" r="13" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="2"/><text x="49" y="381.0" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="12" font-weight="700" fill="#3B5BDB">2</text><path d="M 622 576.0 L 651 576.0 L 651 690.0 L 622 690.0" fill="none" stroke="#612B9B" stroke-width="2.3" marker-end="url(#m0)"/><circle cx="651" cy="600.0" r="13" fill="#FFFFFF" stroke="#612B9B" stroke-width="2"/><text x="651" y="604.5" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="12" font-weight="700" fill="#612B9B">1</text><path d="M 622 738.0 L 617 738.0 L 617 632.0 L 622 632.0" fill="none" stroke="#B48B2E" stroke-width="2.3" marker-end="url(#m4)"/><circle cx="617" cy="656.0" r="13" fill="#FFFFFF" stroke="#B48B2E" stroke-width="2"/><text x="617" y="660.5" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="12" font-weight="700" fill="#B48B2E">10</text><path d="M 1090 620.5 L 1061 620.5 L 1061 305.0 L 1090 305.0" fill="none" stroke="#3B5BDB" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#m1)"/><circle cx="1061" cy="642.5" r="13" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="2"/><text x="1061" y="647.0" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="12" font-weight="700" fill="#3B5BDB">13</text><path d="M 1634 656.5 L 1663 656.5 L 1663 542.5 L 1634 542.5" fill="none" stroke="#B48B2E" stroke-width="2.3" marker-end="url(#m4)"/><circle cx="1663" cy="678.5" r="13" fill="#FFFFFF" stroke="#B48B2E" stroke-width="2"/><text x="1663" y="683.0" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="12" font-weight="700" fill="#B48B2E">12</text><path d="M 680 718.5 L 732 718.5" fill="none" stroke="#1E7A5A" stroke-width="2.3" marker-end="url(#m2)"/><circle cx="706.0" cy="718.5" r="13" fill="#FFFFFF" stroke="#1E7A5A" stroke-width="2"/><text x="706.0" y="723.0" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="12" font-weight="700" fill="#1E7A5A">6</text><path d="M 980 737.0 L 1032 737.0" fill="none" stroke="#1E7A5A" stroke-width="2.3" marker-end="url(#m2)"/><circle cx="1006.0" cy="737.0" r="13" fill="#FFFFFF" stroke="#1E7A5A" stroke-width="2"/><text x="1006.0" y="741.5" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="12" font-weight="700" fill="#1E7A5A">8</text><path d="M 1032 685.0 L 980 685.0" fill="none" stroke="#C0392B" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#m3)"/><circle cx="1006.0" cy="685.0" r="13" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/><text x="1006.0" y="689.5" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="12" font-weight="700" fill="#C0392B">10</text><path d="M 1572 893.5 L 1572 973.0 L 140 973.0 L 140 927.0" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#m3)"/><circle cx="1572" cy="945.0" r="13" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/><text x="1572" y="949.5" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="12" font-weight="700" fill="#C0392B">15</text><text x="856" y="963.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="14" fill="#C0392B">反向 Write：对端 CPU 不参与</text><line x1="45" y1="1005.0" x2="1715" y2="1005.0" stroke="#C9CFDC"/><line x1="69.0" y1="1035.0" x2="105.0" y2="1035.0" stroke="#612B9B" stroke-width="2.6"/><text x="115.0" y="1040.0" font-family="Noto Sans CJK SC" font-size="14" fill="#5B6478">常规 verbs 控制路径</text><line x1="346.90000000000003" y1="1035.0" x2="382.90000000000003" y2="1035.0" stroke="#3B5BDB" stroke-width="2.6"/><text x="392.90000000000003" y="1040.0" font-family="Noto Sans CJK SC" font-size="14" fill="#5B6478">IBGDA（GPU 直接发起）</text><line x1="640.2" y1="1035.0" x2="676.2" y2="1035.0" stroke="#3B5BDB" stroke-width="2.6" stroke-dasharray="6 5"/><text x="686.2" y="1040.0" font-family="Noto Sans CJK SC" font-size="14" fill="#5B6478">GPUDirect RDMA（显存直连）</text><line x1="972.0" y1="1035.0" x2="1008.0" y2="1035.0" stroke="#1E7A5A" stroke-width="2.6"/><text x="1018.0" y="1040.0" font-family="Noto Sans CJK SC" font-size="14" fill="#5B6478">数据面 RoCEv2 RC 报文</text><line x1="1266.7" y1="1035.0" x2="1302.7" y2="1035.0" stroke="#C0392B" stroke-width="2.6" stroke-dasharray="7 6"/><text x="1312.7" y="1040.0" font-family="Noto Sans CJK SC" font-size="14" fill="#5B6478">ACK / NAK / CNP</text><line x1="1522.2" y1="1035.0" x2="1558.2" y2="1035.0" stroke="#B48B2E" stroke-width="2.6"/><text x="1568.2" y="1040.0" font-family="Noto Sans CJK SC" font-size="14" fill="#5B6478">完成事件 CQE</text><text x="880.0" y="1069.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="13" fill="#8A93A6">说明：①–⑯ 为一次 RDMA 操作的顺序；GPUDirect 与 IBGDA 是 GPU 场景下的两条发起 / 落点方式，普通 verbs 应用走 ①–④ 路径。</text></svg>